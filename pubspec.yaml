name: reelshelf
description: Unstreamed - a modern physical movie collection tracker for Android.
publish_to: "none"
version: 0.5.0+17

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^12.3.0
  google_mlkit_text_recognition: ^0.15.1
  http: ^1.6.0
  image_picker: ^1.2.3
  mobile_scanner: ^7.4.0
  path: ^1.9.1
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/unstreamed_splash.png
    - assets/branding/unstreamed_icon.png
